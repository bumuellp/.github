---
default_language_version:
  node: 24.21.0
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.93.5
    hooks:
      - id: renovate-config-validator
        files: ^(renovate-config\.json|\.github/renovate\.json)$

  - repo: https://github.com/bumuellp/cabumtain-hook
    rev: v1.9.0
    hooks:
      - id: commit-msg
      - id: secret-scan
      - id: yaml-xml-lint
      - id: trivy-config
        exclude: ^tests/fixtures/
      - id: aislop

  - repo: local
    hooks:
      - id: renovate-extract-test
        name: Test Renovate extraction against fixtures
        entry: node --test scripts/test-renovate-extract.mjs
        language: node
        additional_dependencies: ['renovate@44.93.5']
        files: ^(renovate-config\.json|scripts/test-renovate-extract\.mjs|tests/fixtures/.*)$
        pass_filenames: false
